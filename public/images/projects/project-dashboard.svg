<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#dashBg)" />

  <g transform="translate(60, 40)">
    <rect width="680" height="420" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2" />
    
    <!-- Titlebar -->
    <rect width="680" height="42" rx="12" fill="#1e293b" />
    <rect y="30" width="680" height="12" fill="#1e293b" />
    <circle cx="24" cy="21" r="6" fill="#ef4444" />
    <circle cx="44" cy="21" r="6" fill="#f59e0b" />
    <circle cx="64" cy="21" r="6" fill="#10b981" />
    <text x="340" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Analytics & System Dashboard</text>

    <!-- Sidebar Mini -->
    <rect x="0" y="42" width="60" height="378" fill="#1e293b" opacity="0.6" />
    <circle cx="30" cy="70" r="14" fill="#38bdf8" />
    <rect x="18" y="110" width="24" height="20" rx="4" fill="#64748b" />
    <rect x="18" y="145" width="24" height="20" rx="4" fill="#64748b" />
    <rect x="18" y="180" width="24" height="20" rx="4" fill="#64748b" />
    <rect x="18" y="215" width="24" height="20" rx="4" fill="#64748b" />

    <!-- Main Content Area -->
    <!-- Top Stat Row -->
    <g transform="translate(85, 60)">
      <rect width="180" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="15" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">TOTAL USERS</text>
      <text x="15" y="52" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">14,820</text>
      <text x="120" y="52" fill="#10b981" font-family="system-ui, sans-serif" font-size="12">+12.5%</text>

      <rect x="195" width="180" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="210" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">API REQUESTS</text>
      <text x="210" y="52" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">1.2M</text>
      <text x="315" y="52" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12">99.9%</text>

      <rect x="390" width="180" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="405" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">SERVER LATENCY</text>
      <text x="405" y="52" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">38 ms</text>
      <text x="510" y="52" fill="#10b981" font-family="system-ui, sans-serif" font-size="12">Optimal</text>
    </g>

    <!-- Chart Area -->
    <g transform="translate(85, 145)">
      <rect width="570" height="245" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="20" y="30" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Grafik Pertumbuhan Trafik & Transaksi</text>
      <text x="20" y="48" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Data 30 hari terakhir diperbarui secara realtime</text>

      <!-- Chart Axes Grid -->
      <line x1="40" y1="80" x2="530" y2="80" stroke="#334155" stroke-dasharray="3,3" />
      <line x1="40" y1="120" x2="530" y2="120" stroke="#334155" stroke-dasharray="3,3" />
      <line x1="40" y1="160" x2="530" y2="160" stroke="#334155" stroke-dasharray="3,3" />
      <line x1="40" y1="200" x2="530" y2="200" stroke="#334155" />

      <!-- Area Chart Polygon -->
      <polygon points="50,195 100,165 150,140 200,155 250,120 300,110 350,135 400,95 450,85 500,75 520,70 520,200 50,200" fill="url(#chartGrad)" />
      
      <!-- Line Stroke -->
      <polyline points="50,195 100,165 150,140 200,155 250,120 300,110 350,135 400,95 450,85 500,75 520,70" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Data Dots -->
      <circle cx="250" cy="120" r="4" fill="#38bdf8" stroke="#0f172a" stroke-width="2" />
      <circle cx="450" cy="85" r="4" fill="#38bdf8" stroke="#0f172a" stroke-width="2" />
      <circle cx="520" cy="70" r="5" fill="#10b981" stroke="#0f172a" stroke-width="2" />

      <!-- Labels -->
      <text x="50" y="220" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Minggu 1</text>
      <text x="200" y="220" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Minggu 2</text>
      <text x="350" y="220" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Minggu 3</text>
      <text x="500" y="220" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Minggu 4</text>
    </g>
  </g>
</svg>
