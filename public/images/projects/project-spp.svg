      <text x="220" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Kelas 5A</text>
      <text x="320" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Oktober 2024</text>
      <text x="430" y="65" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">Rp 150.000</text>
      <rect x="525" y="52" width="65" height="18" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
      <text x="557" y="65" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">LUNAS</text>

      <!-- Row 2 -->
      <line x1="15" y1="80" x2="610" y2="80" stroke="#1e293b" stroke-width="1" />
      <text x="20" y="105" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">20240102 - Siti Nurhaliza</text>
      <text x="220" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Kelas 6B</text>
      <text x="320" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Oktober 2024</text>
      <text x="430" y="105" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">Rp 150.000</text>
      <rect x="525" y="92" width="65" height="18" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
      <text x="557" y="105" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">LUNAS</text>

      <!-- Row 3 -->
      <line x1="15" y1="120" x2="610" y2="120" stroke="#1e293b" stroke-width="1" />
      <text x="20" y="145" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">20240103 - Budi Santoso</text>
      <text x="220" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Kelas 4C</text>
      <text x="320" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Oktober 2024</text>
      <text x="430" y="145" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">Rp 150.000</text>
      <rect x="525" y="132" width="65" height="18" rx="4" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" />
      <text x="557" y="145" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">PENDING</text>

      <!-- Row 4 -->
      <line x1="15" y1="160" x2="610" y2="160" stroke="#1e293b" stroke-width="1" />
      <text x="20" y="185" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">20240104 - Diana Putri</text>
      <text x="220" y="185" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Kelas 3A</text>
      <text x="320" y="185" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Oktober 2024</text>
      <text x="430" y="185" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">Rp 150.000</text>
      <rect x="525" y="172" width="65" height="18" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
      <text x="557" y="185" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">LUNAS</text>

      <!-- Pagination footer -->
      <line x1="0" y1="205" x2="625" y2="205" stroke="#334155" stroke-width="1" />
      <text x="20" y="226" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Menampilkan 1-4 dari 380 transaksi</text>
      <rect x="535" y="213" width="75" height="20" rx="4" fill="#0284c7" />
      <text x="572" y="227" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Cetak Laporan</text>
