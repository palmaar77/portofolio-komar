<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sppBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="sppCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sppBg)" />

  <g transform="translate(60, 40)">
    <rect width="680" height="420" rx="12" fill="url(#sppCard)" stroke="#334155" stroke-width="2" />
    
    <!-- Titlebar -->
    <rect width="680" height="42" rx="12" fill="#1e293b" />
    <rect y="30" width="680" height="12" fill="#1e293b" />
    <line x1="0" y1="42" x2="680" y2="42" stroke="#334155" stroke-width="1" />
    <circle cx="24" cy="21" r="6" fill="#ef4444" />
    <circle cx="44" cy="21" r="6" fill="#f59e0b" />
    <circle cx="64" cy="21" r="6" fill="#10b981" />
    <text x="340" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Sistem Manajemen Pembayaran SPP</text>

    <!-- Stat widgets -->
    <g transform="translate(25, 60)">
      <rect width="195" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="18" y="30" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Total Pemasukan Bulan Ini</text>
      <text x="18" y="55" fill="#10b981" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Rp 48.500.000</text>

      <rect x="215" width="195" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="233" y="30" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Siswa Lunas</text>
      <text x="233" y="55" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">342 / 380 (90%)</text>

      <rect x="430" width="195" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="448" y="30" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Status Tunggakan</text>
      <text x="448" y="55" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">38 Siswa</text>
    </g>

    <!-- Data Table Mockup -->
    <g transform="translate(25, 150)">
      <rect width="625" height="240" rx="8" fill="#0b0f19" stroke="#334155" stroke-width="1" />
      <!-- Table Header -->
      <rect width="625" height="38" rx="8" fill="#1e293b" />
      <rect y="25" width="625" height="13" fill="#1e293b" />
      <line x1="0" y1="38" x2="625" y2="38" stroke="#334155" stroke-width="1" />
      <text x="20" y="24" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">NIS / NAMA SISWA</text>
      <text x="220" y="24" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">KELAS</text>
      <text x="320" y="24" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">PERIODE</text>
      <text x="430" y="24" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">NOMINAL</text>
      <text x="535" y="24" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">STATUS</text>

      <!-- Row 1 -->
