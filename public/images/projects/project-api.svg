<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="apiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#apiBg)" />

  <g transform="translate(60, 40)">
    <rect width="680" height="420" rx="12" fill="#0b0f19" stroke="#1e293b" stroke-width="2" />
    
    <!-- Titlebar Terminal -->
    <rect width="680" height="42" rx="12" fill="#1e293b" />
    <rect y="30" width="680" height="12" fill="#1e293b" />
    <circle cx="24" cy="21" r="6" fill="#ef4444" />
    <circle cx="44" cy="21" r="6" fill="#f59e0b" />
    <circle cx="64" cy="21" r="6" fill="#10b981" />
    <text x="340" y="26" fill="#94a3b8" font-family="'Courier New', monospace" font-size="12" text-anchor="middle">api-server: ~/v1/endpoints (HTTP/2 - 200 OK)</text>

    <!-- Code / Terminal Content -->
    <g transform="translate(30, 60)" font-family="'Courier New', monospace" font-size="12">
      <!-- Route 1 -->
      <rect width="620" height="55" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="15" y="15" width="55" height="24" rx="4" fill="#10b981" />
      <text x="42" y="31" fill="#020617" font-weight="bold" text-anchor="middle">GET</text>
      <text x="85" y="31" fill="#f8fafc" font-weight="bold">/api/v1/students</text>
      <text x="300" y="31" fill="#94a3b8">Fetch paginated records with RLS</text>
      <rect x="530" y="17" width="75" height="20" rx="4" fill="#0284c7" fill-opacity="0.3" />
      <text x="567" y="31" fill="#38bdf8" text-anchor="middle">200 OK</text>

      <!-- Route 2 -->
      <g transform="translate(0, 65)">
        <rect width="620" height="55" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <rect x="15" y="15" width="55" height="24" rx="4" fill="#38bdf8" />
        <text x="42" y="31" fill="#020617" font-weight="bold" text-anchor="middle">POST</text>
        <text x="85" y="31" fill="#f8fafc" font-weight="bold">/api/v1/payments/verify</text>
        <text x="330" y="31" fill="#94a3b8">Validate signature & payload</text>
        <rect x="530" y="17" width="75" height="20" rx="4" fill="#10b981" fill-opacity="0.3" />
        <text x="567" y="31" fill="#10b981" text-anchor="middle">201 Created</text>
      </g>

      <!-- Route 3 -->
      <g transform="translate(0, 130)">
        <rect width="620" height="55" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <rect x="15" y="15" width="55" height="24" rx="4" fill="#f59e0b" />
        <text x="42" y="31" fill="#020617" font-weight="bold" text-anchor="middle">PUT</text>
        <text x="85" y="31" fill="#f8fafc" font-weight="bold">/api/v1/users/:id/role</text>
        <text x="330" y="31" fill="#94a3b8">RBAC admin permission guard</text>
        <rect x="530" y="17" width="75" height="20" rx="4" fill="#0284c7" fill-opacity="0.3" />
        <text x="567" y="31" fill="#38bdf8" text-anchor="middle">200 OK</text>
      </g>

      <!-- JSON Preview Box -->
      <g transform="translate(0, 195)">
        <rect width="620" height="135" rx="6" fill="#020617" stroke="#334155" stroke-width="1" />
        <text x="20" y="25" fill="#64748b">// Response Sample (application/json)</text>
        <text x="20" y="50" fill="#cbd5e1">{</text>
        <text x="40" y="70" fill="#38bdf8">  "status": <tspan fill="#10b981">"success"</tspan>,</text>
        <text x="40" y="90" fill="#38bdf8">  "code": <tspan fill="#f59e0b">200</tspan>,</text>
        <text x="40" y="110" fill="#38bdf8">  "message": <tspan fill="#10b981">"Request processed in 24ms"</tspan></text>
        <text x="20" y="125" fill="#cbd5e1">}</text>
      </g>
    </g>
  </g>
</svg>
