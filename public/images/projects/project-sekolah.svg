<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <rect width="800" height="500" fill="#000000" opacity="0.3" />

  <!-- Grid pattern overlay -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Browser Window Mockup -->
  <g transform="translate(60, 40)">
    <!-- Window Frame -->
    <rect width="680" height="420" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="2" />
    
    <!-- Titlebar -->
    <rect width="680" height="42" rx="12" fill="#1e293b" />
    <rect y="30" width="680" height="12" fill="#1e293b" />
    <line x1="0" y1="42" x2="680" y2="42" stroke="#334155" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="24" cy="21" r="6" fill="#ef4444" />
    <circle cx="44" cy="21" r="6" fill="#f59e0b" />
    <circle cx="64" cy="21" r="6" fill="#10b981" />

    <!-- Address Bar -->
    <rect x="100" y="10" width="480" height="22" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="120" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">https://website-sekolah-sd.vercel.app</text>

    <!-- School Header -->
    <rect x="25" y="60" width="630" height="70" rx="8" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1" />
    <circle cx="65" cy="95" r="22" fill="#0284c7" />
    <text x="65" y="101" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">SD</text>
    <text x="105" y="90" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Portal Informasi Sekolah Dasar</text>
    <text x="105" y="108" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Mewujudkan Generasi Cerdas, Kreatif, dan Berakhlak Mulia</text>

    <!-- Content Columns -->
    <!-- Col 1: Agenda & News -->
    <rect x="25" y="145" width="200" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="40" y="160" width="120" height="14" rx="4" fill="url(#accentGrad)" />
    <rect x="40" y="190" width="170" height="8" rx="2" fill="#64748b" />
    <rect x="40" y="205" width="150" height="8" rx="2" fill="#64748b" />
    <rect x="40" y="220" width="130" height="8" rx="2" fill="#64748b" />
    <rect x="40" y="250" width="80" height="24" rx="4" fill="#0284c7" />
    <text x="80" y="266" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Lihat Agenda</text>

    <!-- Col 2: Galeri & Aktivitas -->
    <rect x="240" y="145" width="200" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="255" y="160" width="130" height="14" rx="4" fill="url(#accentGrad)" />
    <rect x="255" y="190" width="170" height="60" rx="6" fill="#334155" opacity="0.6" />
    <text x="340" y="225" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Galeri Dokumentasi</text>
    <rect x="255" y="260" width="170" height="8" rx="2" fill="#64748b" />

    <!-- Col 3: Pengumuman Siswa -->
    <rect x="455" y="145" width="200" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="470" y="160" width="140" height="14" rx="4" fill="url(#accentGrad)" />
    <rect x="470" y="190" width="170" height="10" rx="3" fill="#10b981" opacity="0.8" />
    <rect x="470" y="210" width="170" height="8" rx="2" fill="#64748b" />
    <rect x="470" y="225" width="150" height="8" rx="2" fill="#64748b" />
    <rect x="470" y="240" width="160" height="8" rx="2" fill="#64748b" />

    <!-- Bottom Banner -->
    <rect x="25" y="310" width="630" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="50" y="345" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Pendaftaran Siswa Baru (PPDB Online)</text>
    <text x="50" y="368" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Terintegrasi dengan formulir digital & verifikasi berkas secara online.</text>
    <rect x="520" y="335" width="115" height="36" rx="6" fill="#38bdf8" />
    <text x="577" y="358" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Daftar Sekarang</text>
  </g>
</svg>
